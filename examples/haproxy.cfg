# HAProxy in front of several TLS services, routing by SNI without terminating TLS. The map server
# runs with COMPOSE_FILE=compose.yaml:compose.behind-proxy.yaml in the same Docker network as
# HAProxy (INGRESS_NETWORK) and is reached by its alias (INGRESS_ALIAS).

global
    log stdout format raw local0

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5s
    timeout client  5m
    timeout server  5m

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

frontend http_in
    bind *:80
    mode http
    redirect scheme https code 301

frontend https_in
    bind *:443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }

    use_backend maps if { req_ssl_sni -i maps.example.com }

backend maps
    # The PROXY protocol hands Caddy the client's address; the map server expects it.
    server maps maps_example_com:443 resolvers docker init-addr none send-proxy-v2
